apiVersion: apps/v1
kind: Deployment
metadata:
  name: solid-vite
  namespace: solid-vite
  labels:
    app: solid-vite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solid-vite
  template:
    metadata:
      labels:
        app: solid-vite
    spec:
      containers:
      - name: solid-vite
        image: solid-vite
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5173
          name: http
          protocol: TCP
      restartPolicy: Always
